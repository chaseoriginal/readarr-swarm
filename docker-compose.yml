x-base: &base
  restart: unless-stopped
  networks:
    - readarr-swarm_default

services:
  readarr:
    <<: *base
    image: linuxserver/readarr:0.4.19-nightly
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    volumes:
      - readarr.config:/config
      - readarr.db:/db
      - /media/Multimedia/Books:/books
      - /media/Multimedia/Incoming:/downloads
    ports:
      - target: 8787
        published: 8787
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.readarr == true
      restart_policy:
        condition: on-failure

volumes:
  readarr.config:
    name: readarr-swarm.config
  readarr.db:
    name: readarr-swarm.db

networks:
  readarr-swarm_default:
    external: true
    name: readarr-swarm_default
