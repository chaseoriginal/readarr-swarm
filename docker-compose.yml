services:
  readarr:
    image: linuxserver/readarr:0.4.18-nightly
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    volumes:
    - readarr-swarm_config:/config
    ports:
    - target: 8787
      published: 8787
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  readarr-swarm_config:
    name: readarr-swarm_config
